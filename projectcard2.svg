<svg width="400" height="150" viewBox="0 0 400 150" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Ubuntu, Sans-Serif">
  <style>
    .title { font-size: 18px; font-weight: 600; fill: #6a0dad; }
    .desc  { font-size: 13px; fill: #8b949e; }
    .lang  { font-size: 12px; fill: #8b949e; }
  </style>

  <!-- fundo + borda -->
  <rect x="1" y="1" rx="6" width="398" height="148" fill="#0D1117" stroke="#6a0dad" stroke-width="1"/>

  <!-- icone de pasta/codigo -->
  <path d="M22 28 h16 l4 5 h14 a2 2 0 0 1 2 2 v18 a2 2 0 0 1 -2 2 h-34 a2 2 0 0 1 -2 -2 v-23 a2 2 0 0 1 2 -2 z"
        fill="none" stroke="#9d4edd" stroke-width="1.6"/>

  <!-- titulo -->
  <text x="70" y="42" class="title">web-copilot</text>

  <!-- descricao -->
  <text class="desc">
    <tspan x="24" y="72">Seu copiloto para testes manuais:</tspan>
    <tspan x="24" y="90">menos atrito, mais agilidade em QA.</tspan>
  </text>

  <!-- linguagem principal -->
  <circle cx="30" cy="122" r="6" fill="#9d4edd"/>
  <text x="44" y="126" class="lang">TypeScript</text>
</svg>
